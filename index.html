<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0f7f8b">
  <title>EA Fair Sale</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>
  <div class="app-shell">
<main class="main">
      <header class="appbar">
        <div class="appbar-left">
          <button id="homeBackBtn" class="appbar-icon hidden" type="button" onclick="go('home')" aria-label="กลับหน้าหลัก">←</button>
          <div class="app-logo">EA</div>
          <div class="appbar-title-wrap">
            <h1 id="pageTitle">MENU</h1>
            <p id="pageSubtitle">EA Fair Sale</p>
          </div>
        </div>

        <div class="appbar-actions">
          <button class="appbar-icon" type="button" onclick="toggleSearch()" aria-label="ค้นหา">⌕</button>
          <button class="appbar-icon" type="button" onclick="refreshData()" aria-label="รีเฟรช">↻</button>
        </div>

        <div id="searchPanel" class="app-search-panel hidden">
          <input id="searchInput" type="search" placeholder="ค้นหาสินค้า...">
          <button class="appbar-icon" type="button" onclick="toggleSearch()">✕</button>
        </div>
      </header>

      <section id="content" class="content"></section>

      <nav class="bottom-nav" aria-label="เมนูหลัก">
        <button class="bottom-nav-item active" data-nav="home" onclick="go('home')">
          <span class="bottom-nav-icon">⌂</span>
          <span>HOME</span>
        </button>
        <button class="bottom-nav-item" data-nav="sale" onclick="go('sale')">
          <span class="bottom-nav-icon">🛒</span>
          <span>POS</span>
        </button>
        <button class="bottom-nav-item" data-nav="stock" onclick="go('stock')">
          <span class="bottom-nav-icon">▣</span>
          <span>STOCK</span>
        </button>
        <button class="bottom-nav-item" data-nav="home" onclick="go('home')">
          <span class="bottom-nav-icon">☰</span>
          <span>MENU</span>
        </button>
      </nav>
    </main>
  </div>

  <dialog id="modal">
    <form method="dialog" class="modal-card">
      <div class="modal-head">
        <h3 id="modalTitle">เพิ่มสินค้า</h3>
        <button class="icon-close" value="cancel">✕</button>
      </div>
      <div id="modalBody" class="modal-body"></div>
    </form>
  </dialog>

  <dialog id="scannerDialog" class="scanner-dialog">
    <div class="scanner-card">
      <div class="scanner-head">
        <div><h3>📷 สแกนบาร์โค้ด</h3><p>หันกล้องหลังไปที่บาร์โค้ดสินค้า</p></div>
        <button class="icon-close" type="button" onclick="stopScanner()">✕</button>
      </div>
      <div class="scanner-video-wrap">
        <video id="scannerVideo" playsinline muted></video>
        <div class="scan-frame"></div>
      </div>
      <div class="scanner-foot">
        <span id="scannerStatus">กำลังเปิดกล้อง...</span>
        <button class="btn btn-light" type="button" onclick="stopScanner()">ปิดกล้อง</button>
      </div>
    </div>
  </dialog>

  <div id="toast" class="toast"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/@zxing/browser@latest"></script>
  <script src="supabase-config.js"></script>
  <script src="index.js"></script>
</body>
</html>
